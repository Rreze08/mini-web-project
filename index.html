
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website-i im i pare online!</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            max-width: 350px;
            margin: 50px auto;
            padding: 25px;
            background-color: #1e1e1e;
            border-radius: 10px;
        }

        h1 {
            color: #a78bfa;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
            border-radius: 5px;
            font-size: 16px;
        }

        input {
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #444;
        }

        button {
            background-color: #8b5cf6;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #7045d8;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Birthday Day Finder</h1>
        <p>Find out what day of the week you were born.</p>

        <input type="date" id="birthdate">

        <button onclick="findDay()">Find Day</button>

        <p id="result"></p>
    </div>

    <script>
        function findDay() {
            const value = document.getElementById("birthdate").value;
            const result = document.getElementById("result");

            if (value === "") {
                result.textContent = "Please select a date.";
                return;
            }

            const [year, month, day] = value.split("-").map(Number);
            const date = new Date(Date.UTC(year, month - 1, day));

            const days = [
                "Sunday", "Monday", "Tuesday", "Wednesday",
                "Thursday", "Friday", "Saturday"
            ];

            result.textContent =
                "You were born on a " + days[date.getUTCDay()] + ".";
        }
    </script>

</body>
</html>
